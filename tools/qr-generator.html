<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد رموز QR - منصة الأدوات المصغرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <header class="p-4 border-b border-slate-800 flex justify-between items-center max-w-4xl mx-auto w-full">
        <a href="../index.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
        </a>
        <h1 class="text-xl font-bold text-cyan-400"><i class="fa-solid fa-qrcode ml-2"></i>مولد رموز QR</h1>
    </header>

    <main class="max-w-2xl mx-auto p-4 w-full my-8">
        <div class="glass-card p-6 rounded-2xl shadow-xl space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">النص أو الرابط المراد تحويله:</label>
                <input type="text" id="text-input" placeholder="https://example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">لون الرمز:</label>
                    <input type="color" id="fg-color" value="#000000" class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">لون الخلفية:</label>
                    <input type="color" id="bg-color" value="#ffffff" class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer">
                </div>
            </div>

            <div class="flex justify-center p-6 bg-white rounded-xl shadow-inner" id="qrcode-container">
                <div id="qrcode"></div>
            </div>

            <button onclick="downloadQR()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-3 px-6 rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> تحميل الرمز (PNG)
            </button>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        منصة الأدوات المصغرة &copy; 2025
    </footer>

    <script>
        const textInput = document.getElementById('text-input');
        const fgColor = document.getElementById('fg-color');
        const bgColor = document.getElementById('bg-color');
        const qrContainer = document.getElementById('qrcode');

        let qrcode = new QRCode(qrContainer, {
            text: "https://example.com",
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        function updateQR() {
            qrContainer.innerHTML = "";
            let textValue = textInput.value.trim() || "https://example.com";
            new QRCode(qrContainer, {
                text: textValue,
                width: 200,
                height: 200,
                colorDark: fgColor.value,
                colorLight: bgColor.value,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        textInput.addEventListener('input', updateQR);
        fgColor.addEventListener('input', updateQR);
        bgColor.addEventListener('input', updateQR);

        function downloadQR() {
            const img = qrContainer.querySelector('img');
            const canvas = qrContainer.querySelector('canvas');
            let dataUrl = "";
            if (img && img.src) {
                dataUrl = img.src;
            } else if (canvas) {
                dataUrl = canvas.toDataURL("image/png");
            }
            if (dataUrl) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = 'qrcode.png';
                link.click();
            }
        }
    </script>
</body>
</html>
