<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد رموز QR الاحترافي | QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Tajawal', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 1);
        }
        #qr-result img {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 10px solid white;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full glass-card rounded-3xl p-6 sm:p-8 shadow-2xl transition-all">
        <!-- Header Bar with Back Link -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
            <h1 class="text-lg font-bold text-sky-400">مولد رموز QR</h1>
            <a href="../index.html" class="text-xs sm:text-sm bg-slate-900 text-slate-300 hover:text-sky-400 px-3 py-1.5 rounded-lg border border-slate-700 font-bold transition-all">
                ← العودة للرئيسية
            </a>
        </div>

        <div class="text-center mb-6">
            <div class="bg-sky-500/20 text-sky-400 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-sky-500/30 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                </svg>
            </div>
            <p class="text-slate-400 text-sm">حول أي رابط أو نص إلى رمز QR في ثوانٍ</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-2">الرابط أو النص</label>
                <input type="text" id="qr-input" placeholder="https://example.com" 
                    class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-sky-400 focus:border-transparent outline-none transition-all text-left" dir="ltr">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2">الحجم</label>
                    <select id="qr-size" class="w-full px-3 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-sky-400 outline-none cursor-pointer">
                        <option value="150">صغير (150x150)</option>
                        <option value="300" selected>متوسط (300x300)</option>
                        <option value="500">كبير (500x500)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2">اللون</label>
                    <input type="color" id="qr-color" value="#000000" class="w-full h-12 p-1 rounded-xl bg-slate-900 border border-slate-700 cursor-pointer">
                </div>
            </div>

            <button onclick="generateQR()" class="w-full bg-sky-400 hover:bg-sky-500 text-slate-950 font-extrabold py-3 rounded-xl transition-all transform active:scale-95 shadow-lg shadow-sky-400/20">
                توليد الرمز الآن
            </button>

            <div id="qr-result" class="hidden flex flex-col items-center justify-center mt-6">
                <div id="qr-image-container"></div>
                <button onclick="downloadQR()" class="mt-5 flex items-center gap-2 text-sky-400 font-bold hover:text-sky-300 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    تحميل الصورة
                </button>
            </div>
        </div>
    </div>

    <script>
        function generateQR() {
            const text = document.getElementById('qr-input').value;
            const size = document.getElementById('qr-size').value;
            const color = document.getElementById('qr-color').value.substring(1);
            const resultDiv = document.getElementById('qr-result');
            const container = document.getElementById('qr-image-container');

            if (!text) {
                alert('يرجى إدخال نص أو رابط أولاً');
                return;
            }

            const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}&color=${color}`;
            
            container.innerHTML = `<img src="${apiUrl}" alt="QR Code" class="max-w-full h-auto">`;
            resultDiv.classList.remove('hidden');
        }

        async function downloadQR() {
            const img = document.querySelector('#qr-image-container img');
            if (!img) return;

            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'qrcode.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (e) {
                alert('حدث خطأ أثناء التحميل، يرجى محاولة حفظ الصورة يدوياً');
            }
        }
    </script>
</body>
</html>
