<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول النصوص الذكي & SEO | Text Transformer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #38bdf8;
            --pink: #ec4899;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        .container { 
            width: 100%; 
            max-width: 850px; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        h1 { margin: 0; font-size: 1.4rem; color: var(--accent); font-weight: 800; }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-weight: 700;
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--accent); border-color: var(--accent); }

        p.subtitle { color: var(--text-muted); margin-bottom: 1.2rem; font-size: 0.9rem; }

        textarea {
            width: 100%;
            height: 210px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            resize: vertical;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
            margin-bottom: 1rem;
            background: var(--bg);
            color: var(--text-main);
        }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .stats-bar span b { color: var(--accent); }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s;
        }
        button:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); }
        
        button.primary-btn { background: var(--accent); color: #0f172a; border: none; font-weight: 800; }
        button.primary-btn:hover { transform: translateY(-2px); opacity: 0.9; }

        button.accent-btn { background: #475569; color: white; border: none; }
        button.accent-btn:hover { background: #64748b; }

        .action-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 1.2rem;
        }

        .copy-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #0f172a;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: bold;
            display: none;
        }

        @media (max-width: 480px) {
            .controls-grid { grid-template-columns: repeat(2, 1fr); }
            .action-footer { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>✨ محول النصوص الذكي & SEO</h1>
        <a href="../index.html" class="back-link">← العودة للرئيسية</a>
    </div>

    <p class="subtitle">نظف نصوصك، أنشئ روابط URL، وحسن محتواك في ثوانٍ.</p>

    <textarea id="inputText" placeholder="أدخل أو الصق النص هنا..."></textarea>

    <div class="stats-bar">
        <span>كلمات: <b id="wordCount">0</b></span>
        <span>حروف: <b id="charCount">0</b></span>
        <span>أسطر: <b id="lineCount">0</b></span>
    </div>

    <div class="controls-grid">
        <button onclick="transform('upper')">UPPERCASE</button>
        <button onclick="transform('lower')">lowercase</button>
        <button onclick="transform('title')">Title Case</button>
        <button onclick="transform('sentence')">Sentence case</button>
        <button onclick="transform('slug')">URL Slug</button>
        <button onclick="transform('clean')">تنظيف المسافات</button>
        <button onclick="transform('removeExtraLines')">حذف الأسطر الفارغة</button>
        <button onclick="transform('emoji')">إضافة إيموجي ✨</button>
    </div>

    <div class="action-footer">
        <button class="accent-btn" onclick="clearText()">مسح الكل</button>
        <button class="primary-btn" onclick="copyText()">نسخ النص المطور 📋</button>
    </div>
</div>

<div id="toast" class="copy-toast">تم النسخ بنجاح! ✅</div>

<script>
    const textArea = document.getElementById('inputText');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const lineCount = document.getElementById('lineCount');
    const toast = document.getElementById('toast');

    textArea.addEventListener('input', updateStats);

    function updateStats() {
        const text = textArea.value;
        charCount.innerText = text.length;
        wordCount.innerText = text.trim() ? text.trim().split(/\s+/).length : 0;
        lineCount.innerText = text.trim() ? text.split(/
/).length : 0;
    }

    function transform(type) {
        let text = textArea.value;
        if (!text) return;

        switch(type) {
            case 'upper': text = text.toUpperCase(); break;
            case 'lower': text = text.toLowerCase(); break;
            case 'title': 
                text = text.toLowerCase().split(' ').map(s => s.charAt(0).toUpperCase() + s.substring(1)).join(' ');
                break;
            case 'sentence':
                text = text.toLowerCase().replace(/(^\s*\w|[\.\!\?]\s*\w)/g, c => c.toUpperCase());
                break;
            case 'slug':
                text = text.toLowerCase()
                    .replace(/[^\w\s-]/g, '')
                    .replace(/[\s_-]+/g, '-')
                    .replace(/^-+|-+$/g, '');
                break;
            case 'clean':
                text = text.replace(/\s+/g, ' ').trim();
                break;
            case 'removeExtraLines':
                text = text.replace(/
\s*
/g, '
').trim();
                break;
            case 'emoji':
                const emojis = ['🚀', '✨', '🔥', '✅', '💡', '⭐'];
                text = text + ' ' + emojis[Math.floor(Math.random() * emojis.length)];
                break;
        }
        textArea.value = text;
        updateStats();
    }

    function clearText() {
        textArea.value = '';
        updateStats();
    }

    function copyText() {
        if (!textArea.value) return;
        navigator.clipboard.writeText(textArea.value).then(() => {
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        });
    }
</script>

</body>
</html>
