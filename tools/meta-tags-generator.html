<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد وسوم الميتا والسيو الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- زر العودة -->
        <div class="mb-6">
            <a href="../index.html" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl border border-slate-700 transition shadow-lg">
                <i class="fa-solid fa-arrow-right"></i>
                <span>العودة للرئيسية</span>
            </a>
        </div>

        <!-- ترويسة الأداة -->
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-3">
                مولد وسوم الميتا وسيو الموقع
            </h1>
            <p class="text-slate-400 text-sm md:text-base">
                أدخل بيانات موقعك الأساسية واحصل على أكواد Meta Tags الجاهزة لتعزيز ظهورك في محركات البحث ومنصات التواصل الاجتماعي.
            </p>
        </header>

        <!-- هيكل الأداة -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- المدخلات -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
                <h2 class="text-xl font-bold text-emerald-400 border-b border-slate-800 pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> بيانات الموقع
                </h2>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">عنوان الموقع (Title)</label>
                    <input type="text" id="site-title" placeholder="مثال: منصة الأدوات الذكية" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">وصف الموقع (Description)</label>
                    <textarea id="site-desc" rows="3" placeholder="اكتب وصفاً موجزاً وجذاباً لموقعك (حوالي 150 حرف)..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">رابط الموقع (URL)</label>
                    <input type="text" id="site-url" placeholder="https://example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">رابط صورة المعاينة (Image URL)</label>
                    <input type="text" id="site-image" placeholder="https://example.com/image.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">الكلمات المفتاحية (Keywords)</label>
                    <input type="text" id="site-keywords" placeholder="أدوات, سيو, برمجة, تصميم" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- المخرجات -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                        <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
                            <i class="fa-solid fa-code"></i> الوسوم الناتجة
                        </h2>
                        <button onclick="copyMetaTags()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-1.5 rounded-lg text-sm transition flex items-center gap-1.5 shadow-lg shadow-emerald-500/2orge">
                            <i class="fa-solid fa-copy"></i> ناسخ الأكواد
                        </button>
                    </div>

                    <div class="relative">
                        <textarea id="output-code" readonly rows="14" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-emerald-300 focus:outline-none resize-none" placeholder="ستظهر الأكواد هنا تلقائياً..."></textarea>
                    </div>
                </div>

                <div id="copy-alert" class="hidden mt-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-center py-2 rounded-xl text-sm font-semibold animate-pulse">
                    تم نسخ الأكواد بنجاح إلى الحافظة!
                </div>
            </div>
        </div>
    </div>

    <script>
        const titleInput = document.getElementById('site-title');
        const descInput = document.getElementById('site-desc');
        const urlInput = document.getElementById('site-url');
        const imageInput = document.getElementById('site-image');
        const keywordsInput = document.getElementById('site-keywords');
        const outputCode = document.getElementById('output-code');
        const copyAlert = document.getElementById('copy-alert');

        function generateMeta() {
            const title = titleInput.value || 'عنوان الموقع';
            const desc = descInput.value || 'وصف الموقع يظهر هنا...';
            const url = urlInput.value || 'https://example.com';
            const image = imageInput.value || 'https://example.com/image.jpg';
            const keywords = keywordsInput.value || 'أدوات, سيو';

            const tags = `<!-- Primary Meta Tags -->
<title>${title}</title>
<meta name="title" content="${title}">
<meta name="description" content="${desc}">
<meta name="keywords" content="${keywords}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="${url}">
<meta property="og:title" content="${title}">
<meta property="og:description" content="${desc}">
<meta property="og:image" content="${image}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="${url}">
<meta property="twitter:title" content="${title}">
<meta property="twitter:description" content="${desc}">
<meta property="twitter:image" content="${image}">`;

            outputCode.value = tags;
        }

        [titleInput, descInput, urlInput, imageInput, keywordsInput].forEach(input => {
            input.addEventListener('input', generateMeta);
        });

        function copyMetaTags() {
            if(!outputCode.value) return;
            navigator.clipboard.writeText(outputCode.value);
            copyAlert.classList.remove('hidden');
            setTimeout(() => {
                copyAlert.classList.add('hidden');
            }, 2500);
        }

        // توليد افتراضي عند التحميل
        generateMeta();
    </script>
</body>
</html>
