<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول نصوص السيو والروابط الدائمة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2 text-emerald-400">
                <i class="fa-solid fa-wand-magic-sparkles"></i> محول نصوص السيو والروابط
            </h1>
            <a href="../index.html" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-right"></i> الرئيسية
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 w-full flex-grow">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">النص الأصلي:</label>
                <textarea id="inputText" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="اكتب أو الصق النص هنا..."></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">الرابط الدائم (URL Slug):</label>
                    <div class="flex gap-2">
                        <input type="text" id="slugOutput" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-emerald-400 text-sm focus:outline-none">
                        <button onclick="copyText('slugOutput')" class="bg-emerald-600 hover:bg-emerald-500 px-4 rounded-lg text-white transition"><i class="fa-solid fa-copy"></i></button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">الكشاف / الكلمات المفتاحية:</label>
                    <div class="flex gap-2">
                        <input type="text" id="keywordsOutput" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-emerald-400 text-sm focus:outline-none">
                        <button onclick="copyText('keywordsOutput')" class="bg-emerald-600 hover:bg-emerald-500 px-4 rounded-lg text-white transition"><i class="fa-solid fa-copy"></i></button>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">وصف ميتا المقترح (Meta Description):</label>
                <div class="flex gap-2">
                    <textarea id="metaOutput" rows="2" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-emerald-400 text-sm focus:outline-none"></textarea>
                    <button onclick="copyText('metaOutput')" class="bg-emerald-600 hover:bg-emerald-500 px-4 rounded-lg text-white transition self-stretch"><i class="fa-solid fa-copy"></i></button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
        منصة الأدوات المصغرة &copy; 2025 - جميع الحقوق محفوظة
    </footer>

    <script>
        const input = document.getElementById('inputText');
        const slugOutput = document.getElementById('slugOutput');
        const keywordsOutput = document.getElementById('keywordsOutput');
        const metaOutput = document.getElementById('metaOutput');

        input.addEventListener('input', () => {
            let text = input.value.trim();
            if (!text) {
                slugOutput.value = '';
                keywordsOutput.value = '';
                metaOutput.value = '';
                return;
            }

            // Slug generation
            let slug = text.toLowerCase()
                .replace(/[^\w\sع-ي-]/gi, '')
                .replace(/\s+/g, '-');
            slugOutput.value = slug;

            // Keywords generation
            let words = text.replace(/[^\w\sع-ي]/gi, '').split(/\s+/);
            let uniqueWords = [...new Set(words)].filter(w => w.length > 3).slice(0, 8);
            keywordsOutput.value = uniqueWords.join(', ');

            // Meta description
            metaOutput.value = text.length > 150 ? text.substring(0, 147) + '...' : text;
        });

        function copyText(elementId) {
            const el = document.getElementById(elementId);
            el.select();
            document.execCommand('copy');
            alert('تم النسخ بنجاح!');
        }
    </script>
</body>
</html>
