<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُهندس الأوامر الذكي | AI Prompt Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
            --input-bg: #0f172a;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Inter', sans-serif; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 900px; 
            margin: 0 auto; 
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        h1 { 
            font-size: 1.5rem; 
            color: var(--accent); 
            font-weight: 800;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            background: var(--card);
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            font-weight: 700;
        }
        .back-link:hover { color: var(--accent); border-color: var(--accent); }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .main-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        @media (max-width: 768px) { 
            .main-grid { grid-template-columns: 1fr; } 
        }

        .card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
        }

        .input-group { 
            margin-bottom: 18px; 
        }

        .input-group label { 
            display: block; 
            font-weight: 700; 
            margin-bottom: 6px; 
            font-size: 0.85rem; 
            color: var(--text); 
        }

        .input-group input, .input-group textarea, .input-group select { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-family: inherit; 
            font-size: 0.9rem; 
            transition: all 0.2s; 
            background: var(--input-bg);
            color: var(--text);
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        textarea { resize: vertical; }

        .output-area { 
            position: sticky; 
            top: 20px; 
            display: flex; 
            flex-direction: column; 
            height: fit-content; 
        }

        #finalPrompt { 
            width: 100%; 
            height: 280px; 
            padding: 14px; 
            border-radius: 12px; 
            border: 1px dashed var(--accent); 
            background: var(--input-bg); 
            font-family: 'Inter', 'Cairo', monospace; 
            font-size: 0.9rem; 
            resize: none; 
            margin-bottom: 15px; 
            color: #38bdf8;
            outline: none;
        }

        .btn-copy { 
            background: var(--accent); 
            color: #0f172a; 
            border: none; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 0.95rem; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }

        .btn-copy:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-copy:active { transform: scale(0.98); }

        .preset-chips { 
            display: flex; 
            gap: 6px; 
            flex-wrap: wrap; 
            margin-bottom: 12px; 
        }

        .chip { 
            padding: 4px 10px; 
            background: var(--input-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            font-size: 0.75rem; 
            cursor: pointer; 
            color: var(--text-muted);
            transition: all 0.2s; 
            font-weight: 600;
        }

        .chip:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-radius: 6px;
            font-size: 0.7rem;
            margin-bottom: 6px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>🚀 مُهندس الأوامر الذكي</h1>
        <a href="../index.html" class="back-link">← العودة للرئيسية</a>
    </div>

    <p class="subtitle">حول أفكارك إلى أوامر (Prompts) احترافية لدعم نماذج الذكاء الاصطناعي (ChatGPT, Claude, Gemini).</p>

    <div class="main-grid">
        <!-- Input Section -->
        <div class="card">
            <div class="input-group">
                <span class="badge">الخطوة 1</span>
                <label>تقمص الشخصية (Role)</label>
                <div class="preset-chips">
                    <span class="chip" onclick="setRole('خبير تسويق رقمي متخصص في زيادة المبيعات')">خبير تسويق</span>
                    <span class="chip" onclick="setRole('مبرمج Full-Stack محترف في React و Node.js')">مبرمج محترف</span>
                    <span class="chip" onclick="setRole('كاتب محتوى إبداعي ومتخصص في الـ SEO')">كاتب SEO</span>
                    <span class="chip" onclick="setRole('محلل بيانات خبير في استخراج الرؤى الاستراتيجية')">محلل بيانات</span>
                </div>
                <input type="text" id="role" placeholder="مثال: أنت خبير في التغذية العلاجية..." oninput="updatePrompt()">
            </div>

            <div class="input-group">
                <span class="badge">الخطوة 2</span>
                <label>المهمة المطلوبة (Task)</label>
                <textarea id="task" rows="3" placeholder="ما الذي تريد من الذكاء الاصطناعي فعله بالضبط؟" oninput="updatePrompt()"></textarea>
            </div>

            <div class="input-group">
                <span class="badge">الخطوة 3</span>
                <label>السياق والتفاصيل (Context)</label>
                <textarea id="context" rows="3" placeholder="أضف معلومات إضافية، الجمهور المستهدف، أو خلفية عن المشروع..." oninput="updatePrompt()"></textarea>
            </div>

            <div class="input-group">
                <span class="badge">الخطوة 4</span>
                <label>القيود والتنسيق (Constraints & Format)</label>
                <input type="text" id="format" placeholder="مثال: جدول، نقاط، نبرة رسمية، أقل من 200 كلمة..." oninput="updatePrompt()">
            </div>
        </div>

        <!-- Output Section -->
        <div class="output-area">
            <div class="card">
                <label style="display:block; font-weight:700; margin-bottom:10px; color:var(--accent);">✨ الأمر النهائي الجاهز للنسخ:</label>
                <textarea id="finalPrompt" readonly></textarea>
                <button class="btn-copy" onclick="copyPrompt()">
                    <span>📋</span> نسخ الأمر الآن
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function setRole(val) {
        document.getElementById('role').value = val;
        updatePrompt();
    }

    function updatePrompt() {
        const role = document.getElementById('role').value.trim();
        const task = document.getElementById('task').value.trim();
        const context = document.getElementById('context').value.trim();
        const format = document.getElementById('format').value.trim();

        let prompt = "";

        if (role) prompt += `**الشخصية:**\n${role}\n\n`;
        if (task) prompt += `**المهمة:**\n${task}\n\n`;
        if (context) prompt += `**السياق:**\n${context}\n\n`;
        if (format) prompt += `**التنسيق والقيود:**\n${format}\n\n`;

        if (!role && !task && !context && !format) {
            prompt = "ابدأ بتعبئة الحقول لتوليد أمر احترافي...";
        }

        document.getElementById('finalPrompt').value = prompt;
    }

    async function copyPrompt() {
        const text = document.getElementById('finalPrompt').value;
        try {
            await navigator.clipboard.writeText(text);
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerHTML;
            btn.innerHTML = "✅ تم النسخ بنجاح!";
            btn.style.background = "#10b981";
            btn.style.color = "#ffffff";
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = "";
                btn.style.color = "";
            }, 2000);
        } catch (err) {
            alert("فشل النسخ، يرجى النسخ يدوياً");
        }
    }

    // Initialize
    updatePrompt();
</script>

</body>
</html>
