<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد التدرجات اللونية | Gradient Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --border: #334155;
            --accent-yellow: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Inter', sans-serif; }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 950px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 25px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        h1 { margin: 0; color: var(--accent); font-size: 1.5rem; font-weight: 800; }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-weight: 700;
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--accent); border-color: var(--accent); }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .preview-section {
            position: relative;
            min-height: 280px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            border: 1px solid var(--border);
            background: linear-gradient(45deg, #6366f1, #a855f7);
            transition: background 0.3s ease;
        }

        .preview-section h2 {
            font-size: 1.6rem;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            color: #ffffff;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-weight: 700; font-size: 0.88rem; color: #94a3b8; }

        .color-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .color-field {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        input[type="text"] {
            background: transparent;
            border: none;
            color: white;
            font-family: 'Inter', monospace;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }

        .range-slider { width: 100%; cursor: pointer; accent-color: var(--accent); }

        select {
            padding: 10px 12px;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            border: 1px solid var(--border);
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
        }

        .code-output {
            background: #0f172a;
            padding: 14px;
            border-radius: 10px;
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            border: 1px solid var(--border);
            word-break: break-all;
            cursor: pointer;
            direction: ltr;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Cairo';
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-random { background: var(--primary); color: white; }
        .btn-random:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-copy { background: #475569; color: white; }
        .btn-copy:hover { background: #64748b; transform: translateY(-2px); }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-yellow);
            color: #000;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>🎨 مولد التدرجات اللونية (Gradient Generator)</h1>
            <a href="../index.html" class="back-link">← العودة للرئيسية</a>
        </div>

        <div class="main-grid">
            <div class="preview-section" id="preview">
                <h2>تدرج لوني عصري!</h2>
            </div>

            <div class="controls-section">
                <div class="control-group">
                    <label>الألوان</label>
                    <div class="color-inputs">
                        <div class="color-field">
                            <input type="color" id="color1" value="#6366f1">
                            <input type="text" id="hex1" value="#6366f1">
                        </div>
                        <div class="color-field">
                            <input type="color" id="color2" value="#a855f7">
                            <input type="text" id="hex2" value="#a855f7">
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label>الزاوية: <span id="angleVal">45</span>°</label>
                    <input type="range" id="angle" class="range-slider" min="0" max="360" value="45">
                </div>

                <div class="control-group">
                    <label>نوع التدرج</label>
                    <select id="type">
                        <option value="linear-gradient">خطي (Linear)</option>
                        <option value="radial-gradient">دائري (Radial)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>كود CSS</label>
                    <div class="code-output" id="cssCode" title="انقر للنسخ">
                        background: linear-gradient(45deg, #6366f1, #a855f7);
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-random" onclick="randomize()">🎲 عشوائي</button>
                    <button class="btn-copy" onclick="copyCode()">📋 نسخ الكود</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">تم النسخ بنجاح! ✅</div>

    <script>
        const color1 = document.getElementById('color1');
        const color2 = document.getElementById('color2');
        const hex1 = document.getElementById('hex1');
        const hex2 = document.getElementById('hex2');
        const angle = document.getElementById('angle');
        const angleVal = document.getElementById('angleVal');
        const type = document.getElementById('type');
        const preview = document.getElementById('preview');
        const cssCode = document.getElementById('cssCode');
        const toast = document.getElementById('toast');

        function updateGradient() {
            const c1 = color1.value;
            const c2 = color2.value;
            const a = angle.value;
            const t = type.value;
            
            hex1.value = c1.toUpperCase();
            hex2.value = c2.toUpperCase();
            angleVal.innerText = a;

            let gradientString = '';
            if(t === 'linear-gradient') {
                gradientString = `linear-gradient(${a}deg, ${c1}, ${c2})`;
            } else {
                gradientString = `radial-gradient(circle, ${c1}, ${c2})`;
            }

            preview.style.background = gradientString;
            cssCode.innerText = `background: ${gradientString};`;
        }

        function randomize() {
            const randomHex = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            color1.value = randomHex();
            color2.value = randomHex();
            angle.value = Math.floor(Math.random() * 360);
            updateGradient();
        }

        function copyCode() {
            navigator.clipboard.writeText(cssCode.innerText);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        [color1, color2, angle, type].forEach(el => {
            el.addEventListener('input', updateGradient);
        });

        hex1.addEventListener('change', () => {
            if(/^#[0-9A-F]{6}$/i.test(hex1.value)) {
                color1.value = hex1.value;
                updateGradient();
            }
        });

        hex2.addEventListener('change', () => {
            if(/^#[0-9A-F]{6}$/i.test(hex2.value)) {
                color2.value = hex2.value;
                updateGradient();
            }
        });

        cssCode.addEventListener('click', copyCode);
        updateGradient();
    </script>
</body>
</html>
