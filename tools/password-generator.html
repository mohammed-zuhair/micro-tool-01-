<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد كلمات المرور الآمنة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-6">

    <div class="w-full max-w-xl mb-6">
        <a href="../index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-sm font-medium">
            <i class="fa-solid fa-arrow-right"></i>
            العودة للرئيسية
        </a>
    </div>

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl shadow-purple-950/20">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 rounded-xl bg-purple-600/20 border border-purple-500/30 flex items-center justify-center text-purple-400 text-xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-white">مولد كلمات المرور الآمنة</h1>
                <p class="text-slate-400 text-sm">أنشئ كلمات مرور عشوائية وقوية لحماية بياناتك</p>
            </div>
        </div>

        <!-- Result Box -->
        <div class="relative mb-6">
            <input type="text" id="passwordOutput" readonly 
                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 text-lg font-mono text-purple-300 focus:outline-none focus:border-purple-500 transition-colors"
                placeholder="كلمة المرور ستظهر هنا...">
            <button id="copyBtn" onclick="copyPassword()" 
                class="absolute left-2 top-1/2 -translate-y-1/2 bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5 cursor-pointer">
                <i class="fa-regular fa-copy"></i>
                <span>نسخ</span>
            </button>
        </div>

        <!-- Length Slider -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <label class="text-sm font-medium text-slate-300">طول كلمة المرور</label>
                <span id="lengthValue" class="bg-slate-800 text-purple-300 px-2.5 py-1 rounded-md text-sm font-mono font-bold">16</span>
            </div>
            <input type="range" id="lengthRange" min="6" max="64" value="16" 
                class="w-full accent-purple-500 bg-slate-950 h-2 rounded-lg cursor-pointer">
        </div>

        <!-- Options Toggles -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
            <label class="flex items-center gap-3 bg-slate-950 border border-slate-800 p-3 rounded-xl cursor-pointer hover:border-slate-700 transition-colors">
                <input type="checkbox" id="includeUppercase" checked class="w-4 h-4 accent-purple-500 rounded">
                <span class="text-sm text-slate-300">حروف كبيرة (A-Z)</span>
            </label>
            <label class="flex items-center gap-3 bg-slate-950 border border-slate-800 p-3 rounded-xl cursor-pointer hover:border-slate-700 transition-colors">
                <input type="checkbox" id="includeLowercase" checked class="w-4 h-4 accent-purple-500 rounded">
                <span class="text-sm text-slate-300">حروف صغيرة (a-z)</span>
            </label>
            <label class="flex items-center gap-3 bg-slate-950 border border-slate-800 p-3 rounded-xl cursor-pointer hover:border-slate-700 transition-colors">
                <input type="checkbox" id="includeNumbers" checked class="w-4 h-4 accent-purple-500 rounded">
                <span class="text-sm text-slate-300">أرقام (0-9)</span>
            </label>
            <label class="flex items-center gap-3 bg-slate-950 border border-slate-800 p-3 rounded-xl cursor-pointer hover:border-slate-700 transition-colors">
                <input type="checkbox" id="includeSymbols" checked class="w-4 h-4 accent-purple-500 rounded">
                <span class="text-sm text-slate-300">رموز خاصّة (!@#$)</span>
            </label>
        </div>

        <!-- Generate Button -->
        <button onclick="generatePassword()" 
            class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-purple-600/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-rotate"></i>
            توليد كلمة مرور جديدة
        </button>
    </div>

    <script>
        const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
        const numberChars = '0123456789';
        const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        const lengthRange = document.getElementById('lengthRange');
        const lengthValue = document.getElementById('lengthValue');
        const passwordOutput = document.getElementById('passwordOutput');
        
        const includeUppercase = document.getElementById('includeUppercase');
        const includeLowercase = document.getElementById('includeLowercase');
        const includeNumbers = document.getElementById('includeNumbers');
        const includeSymbols = document.getElementById('includeSymbols');

        lengthRange.addEventListener('input', () => {
            lengthValue.textContent = lengthRange.value;
            generatePassword();
        });

        [includeUppercase, includeLowercase, includeNumbers, includeSymbols].forEach(el => {
            el.addEventListener('change', generatePassword);
        });

        function generatePassword() {
            let validChars = '';
            if (includeUppercase.checked) validChars += uppercaseChars;
            if (includeLowercase.checked) validChars += lowercaseChars;
            if (includeNumbers.checked) validChars += numberChars;
            if (includeSymbols.checked) validChars += symbolChars;

            if (validChars === '') {
                passwordOutput.value = 'الرجاء اختيار خيار واحد على الأقل!';
                return;
            }

            let password = '';
            const length = parseInt(lengthRange.value);
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * validChars.length);
                password += validChars[randomIndex];
            }

            passwordOutput.value = password;
        }

        function copyPassword() {
            if (!passwordOutput.value || passwordOutput.value.startsWith('الرجاء')) return;
            navigator.clipboard.writeText(passwordOutput.value);
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>تم النسخ</span>';
            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i><span>نسخ</span>';
            }, 2000);
        }

        // Generate on load
        generatePassword();
    </script>
</body>
</html>
