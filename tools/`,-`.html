<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Wave Generator | مولد الموجات</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }
        .preview-area {
            width: 100%;
            height: 300px;
            background: #ffffff10;
            border-radius: 1rem;
            margin-bottom: 2rem;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            position: relative;
            border: 1px solid #334155;
        }
        #wave-svg {
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label { font-size: 0.9rem; color: #94a3b8; }
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        button:active { transform: scale(0.95); }
        .btn-copy { background: var(--primary); color: white; }
        .btn-download { background: #10b981; color: white; }
        .btn-reset { background: #ef4444; color: white; }
        
        .code-output {
            margin-top: 2rem;
            background: #000;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            color: #10b981;
            border: 1px solid #334155;
        }

        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مولد موجات SVG</h1>
    
    <div class="preview-area" id="preview-container">
        <svg id="wave-svg" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path id="wave-path" d="" fill="#6366f1"></path>
        </svg>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>الارتفاع (Amplitude)</label>
            <input type="range" id="amplitude" min="10" max="150" value="80">
        </div>
        <div class="control-group">
            <label>التردد (Frequency)</label>
            <input type="range" id="frequency" min="0.001" max="0.05" step="0.001" value="0.01">
        </div>
        <div class="control-group">
            <label>النعومة (Smoothness)</label>
            <input type="range" id="smoothness" min="1" max="10" value="5">
        </div>
        <div class="control-group">
            <label>اللون (Color)</label>
            <input type="color" id="color" value="#6366f1">
        </div>
    </div>

    <div class="actions">
        <button class="btn-copy" onclick="copyCode()">نسخ الكود</button>
        <button class="btn-download" onclick="downloadSVG()">تحميل SVG</button>
        <button class="btn-reset" onclick="resetSettings()">إعادة ضبط</button>
    </div>

    <div class="code-output" id="code-display"></div>
</div>

<script>
    const path = document.getElementById('wave-path');
    const svg = document.getElementById('wave-svg');
    const codeDisplay = document.getElementById('code-display');
    
    const inputs = {
        amplitude: document.getElementById('amplitude'),
        frequency: document.getElementById('frequency'),
        smoothness: document.getElementById('smoothness'),
        color: document.getElementById('color')
    };

    function generateWave() {
        const amp = parseFloat(inputs.amplitude.value);
        const freq = parseFloat(inputs.frequency.value);
        const smooth = parseInt(inputs.smoothness.value);
        const color = inputs.color.value;

        let d = `M 0 320 L 0 160 `; // Start point
        
        const width = 1440;
        const height = 320;
        const step = width / 100; // Base resolution

        // Generate points using Sine wave
        let points = [];
        for (let x = 0; x <= width; x += step) {
            const y = 160 + Math.sin(x * freq) * amp;
            points.push({x, y});
        }

        // Build path with Bezier curves for smoothness
        d = `M 0 ${points[0].y}`;
        for (let i = 0; i < points.length - 1; i++) {
            const p1 = points[i];
            const p2 = points[i+1];
            const cp1x = p1.x + (p2.x - p1.x) / 2;
            d += ` C ${cp1x} ${p1.y}, ${cp1x} ${p2.y}, ${p2.x} ${p2.y}`;
        }

        d += ` L ${width} ${height} L 0 ${height} Z`;
        
        path.setAttribute('d', d);
        path.setAttribute('fill', color);
        
        const fullSVG = `<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg"><path d="${d}" fill="${color}"/></svg>`;
        codeDisplay.textContent = fullSVG;
    }

    function copyCode() {
        navigator.clipboard.writeText(codeDisplay.textContent);
        alert('تم نسخ الكود بنجاح!');
    }

    function downloadSVG() {
        const svgData = svg.outerHTML;
        const svgBlob = new Blob([svgData], {type:"image/svg+xml;charset=utf-8"});
        const svgUrl = URL.createObjectURL(svgBlob);
        const downloadLink = document.createElement("a");
        downloadLink.href = svgUrl;
        downloadLink.download = "wave-design.svg";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    function resetSettings() {
        inputs.amplitude.value = 80;
        inputs.frequency.value = 0.01;
        inputs.smoothness.value = 5;
        inputs.color.value = "#6366f1";
        generateWave();
    }

    // Event Listeners
    Object.values(inputs).forEach(input => {
        input.addEventListener('input', generateWave);
    });

    // Initial call
    generateWave();
</script>

</body>
</html>
