<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الأدوات الذكية - Micro Tools Hub</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 15px; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: var(--accent); margin: 0 0 15px 0; font-size: 1.3rem; text-align: center; }
    
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab-btn { background: #0f172a; color: #94a3b8; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    
    .tool-panel { display: none; }
    .tool-panel.active { display: block; }
    
    textarea, input[type="text"], input[type="number"] { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 10px; font-size: 0.95rem; margin-bottom: 12px; }
    textarea { height: 120px; resize: vertical; }
    
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button.action-btn { flex: 1; min-width: 120px; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    
    .output-box { background: #0f172a; border: 1px dashed var(--border); padding: 12px; border-radius: 8px; margin-top: 12px; font-family: monospace; word-break: break-all; font-size: 0.95rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }
    .stat-card { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>منصة الأدوات المصغرة الشاملة</h1>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTool('text-tool', this)">1. معالج النصوص</button>
      <button class="tab-btn" onclick="switchTool('pass-tool', this)">2. مولد كلمة السر</button>
      <button class="tab-btn" onclick="switchTool('qr-tool', this)">3. مولد QR Code</button>
      <button class="tab-btn" onclick="switchTool('calc-tool', this)">4. حاسبة النسب</button>
      <button class="tab-btn" onclick="switchTool('conv-tool', this)">5. المحول النصي</button>
    </div>

    <!-- Tool 1: Text Processor -->
    <div id="text-tool" class="tool-panel active">
      <textarea id="mainText" placeholder="ادخل النص لمعالجته وتحليله..." oninput="analyzeText()"></textarea>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val" id="cCount">0</div>أحرف</div>
        <div class="stat-card"><div class="stat-val" id="wCount">0</div>كلمات</div>
        <div class="stat-card"><div class="stat-val" id="lCount">0</div>أسطر</div>
      </div>
      <div class="btn-group">
        <button class="action-btn" onclick="cleanSpaces()">إزالة المسافات</button>
        <button class="action-btn" onclick="removeDuplicates()">إزالة الأسطر المكررة</button>
        <button class="action-btn" onclick="copyText('mainText')">نسخ النص</button>
      </div>
    </div>

    <!-- Tool 2: Password Generator -->
    <div id="pass-tool" class="tool-panel">
      <label style="display:block; margin-bottom:6px;">طول كلمة السر:</label>
      <input type="number" id="passLength" value="16" min="8" max="64">
      <div class="btn-group">
        <button class="action-btn" onclick="generatePassword()">توليد كلمة سر معقدة</button>
      </div>
      <div class="output-box" id="passOutput">اضغط على زر التوليد...</div>
      <div class="btn-group" style="margin-top:8px;">
        <button class="action-btn" onclick="copyText('passOutput')">نسخ كلمة السر</button>
      </div>
    </div>

    <!-- Tool 3: QR Generator -->
    <div id="qr-tool" class="tool-panel">
      <input type="text" id="qrText" placeholder="أدخل الرابط أو النص لتوليد كود QR...">
      <div class="btn-group">
        <button class="action-btn" onclick="generateQR()">توليد رمز QR</button>
      </div>
      <div style="text-align:center; margin-top:15px;" id="qrOutput"></div>
    </div>

    <!-- Tool 4: Percentage Calculator -->
    <div id="calc-tool" class="tool-panel">
      <label style="display:block; margin-bottom:6px;">احسب نسبة %:</label>
      <input type="number" id="percentVal" placeholder="مثال: 15">
      <label style="display:block; margin-bottom:6px;">من إجمالي المبلغ/العدد:</label>
      <input type="number" id="totalVal" placeholder="مثال: 200">
      <div class="btn-group">
        <button class="action-btn" onclick="calcPercent()">حساب الناتج</button>
      </div>
      <div class="output-box" id="calcOutput">النتيجة ستظهر هنا...</div>
    </div>

    <!-- Tool 5: Converter -->
    <div id="conv-tool" class="tool-panel">
      <textarea id="convInput" placeholder="أدخل النص بالإنجليزية أو رابط للتشفير/الفك..."></textarea>
      <div class="btn-group">
        <button class="action-btn" onclick="convertCase('upper')">حروف كبيرة (UPPER)</button>
        <button class="action-btn" onclick="convertCase('lower')">حروف صغيرة (lower)</button>
        <button class="action-btn" onclick="convertCase('urlEnc')">تشفير URL</button>
        <button class="action-btn" onclick="convertCase('urlDec')">فك تشفير URL</button>
      </div>
    </div>
  </div>

  <script>
    function switchTool(id, btn) {
      document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    function copyText(elemId) {
      const el = document.getElementById(elemId);
      const val = el.value || el.innerText;
      if (val) {
        navigator.clipboard.writeText(val);
        alert('تم النسخ بنجاح!');
      }
    }

    function analyzeText() {
      const txt = document.getElementById('mainText').value;
      document.getElementById('cCount').innerText = txt.length;
      document.getElementById('wCount').innerText = txt.trim() ? txt.trim().split(/\s+/).length : 0;
      document.getElementById('lCount').innerText = txt ? txt.split('\n').length : 0;
    }
    function cleanSpaces() {
      const el = document.getElementById('mainText');
      el.value = el.value.replace(/\s+/g, ' ').trim();
      analyzeText();
    }
    function removeDuplicates() {
      const el = document.getElementById('mainText');
      const lines = el.value.split('\n');
      el.value = [...new Set(lines)].join('\n');
      analyzeText();
    }

    function generatePassword() {
      const len = parseInt(document.getElementById('passLength').value) || 16;
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
      let res = "";
      for (let i = 0; i < len; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('passOutput').innerText = res;
    }

    function generateQR() {
      const val = document.getElementById('qrText').value.trim();
      const out = document.getElementById('qrOutput');
      if (!val) { alert('الرجاء إدخال نص أو رابط أولاً'); return; }
      out.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(val)}" alt="QR Code" style="border-radius:8px; border:2px solid #38bdf8;" />`;
    }

    function calcPercent() {
      const p = parseFloat(document.getElementById('percentVal').value);
      const t = parseFloat(document.getElementById('totalVal').value);
      if (isNaN(p) || isNaN(t)) { alert('يرجى إدخال أرقام صالحة'); return; }
      const res = (p / 100) * t;
      document.getElementById('calcOutput').innerText = `${p}% من ${t} يساوي: ${res}`;
    }

    function convertCase(type) {
      const el = document.getElementById('convInput');
      if (type === 'upper') el.value = el.value.toUpperCase();
      if (type === 'lower') el.value = el.value.toLowerCase();
      if (type === 'urlEnc') el.value = encodeURIComponent(el.value);
      if (type === 'urlDec') el.value = decodeURIComponent(el.value);
    }
  </script>
</body>
</html>
