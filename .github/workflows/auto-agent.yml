name: Autonomous AI Developer Agent Engine

on:
  schedule:
    - cron: '0 0 * * 0' # تشغيل أوتوماتيكي دوري كل أسبوع
  workflow_dispatch:     # إمكانية التشغيل اليدوي في أي وقت
  push:
    paths:
      - 'roadmap.txt'    # يتفعل الإيجنت فوراً عند تعديل ملف الخطة فقط

permissions:
  contents: write

jobs:
  auto-build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade google-generativeai

      - name: Execute Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent.py

      - name: Commit and Push All Structural Changes
        run: |
          git config --global user.name "Autonomous-AI-Agent"
          git config --global user.email "agent@bot.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Autonomous engine updated core files & changelog [Verified]" && git push)
          
